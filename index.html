<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>신도 0번 (가제) — 웹 플레이 프로토타입</title>
<link rel="stylesheet" href="styles/main.css" />
</head>
<body>

<div id="boot-screen">
  <div class="boot-logo">OS</div>
  <div class="boot-computer-label" style="font-size:13px;color:#8fa0a6;"></div>
  <div class="boot-progress"><div class="boot-progress-bar"></div></div>
</div>

<div id="login-screen" style="display:none;">
  <div class="login-card">
    <div class="avatar-circle"><img class="login-avatar-img" alt="" style="width:100%;height:100%;object-fit:cover;" /></div>
    <div class="login-account-name" style="font-size:14px;"></div>
    <input type="password" id="login-pw" placeholder="암호 (영문)" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <button id="login-btn">로그인</button>
    <div class="login-error" id="login-pw-error"></div>
  </div>
</div>

<div id="desktop">
  <div class="desktop-icons" id="desktop-icons"></div>
  <div id="windows-layer"></div>
  <div id="taskbar">
    <button id="start-btn">☰ 시작</button>
    <div id="taskbar-windows"></div>
    <div id="tray">
      <button id="reset-save-btn" title="저장 초기화" style="border:none;background:none;color:var(--text-secondary);cursor:pointer;">초기화</button>
      <span id="tray-clock"></span>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
